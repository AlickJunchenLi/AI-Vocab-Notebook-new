<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#c1d7eb" />
    <meta name="description" content="A personal vocabulary notebook. Collect words, keep notes, and review them each day." />
    <title>Vocabulary Notebook</title>
    <script>
      // Apply the saved colour theme before first paint (see src/theme/themes.js).
      try {
        var theme = localStorage.getItem("notebook.theme");
        if (["lavender", "blue", "pink", "green"].indexOf(theme) !== -1) {
          document.documentElement.dataset.theme = theme;
        } else {
          document.documentElement.dataset.theme = "blue";
        }
      } catch (error) {
        // Fall back to the default theme.
      }
      try {
        // The browser bar colour is matched to the theme's desk once the app
        // starts (syncThemeColor in src/theme/applyTheme.js).
        var dark = localStorage.getItem("notebook.paper-tone") === "dark";
        document.documentElement.dataset.paperTone = dark ? "dark" : "light";
      } catch (error) {
        document.documentElement.dataset.paperTone = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
